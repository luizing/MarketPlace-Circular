# Banco para desenvolvimento local: os dados existem apenas enquanto a aplicacao esta ativa.
spring.datasource.url=jdbc:h2:mem:marketplace-circular;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
